    <path d="M285 290H385"/>
    <path d="M285 420H385"/>
    <path d="M285 550H385"/>
    <path d="M645 405H750"/>
    <path d="M645 540H750"/>
    <path d="M1020 315H1125"/>
    <path d="M1020 480H1125"/>
    <path d="M1242 370V590"/>
    <path d="M1242 535V590"/>
