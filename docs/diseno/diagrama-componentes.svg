    <text x="408" y="532" class="head">ProductoServiceImpl</text>
    <text x="408" y="561" class="body">publicación y búsqueda</text>
    <rect x="385" y="625" width="260" height="72" rx="12" fill="#fff" stroke="#287c6f" stroke-width="2"/>
    <text x="408" y="654" class="stereo">«interface»</text>
    <text x="408" y="681" class="head">ProductoService</text>
