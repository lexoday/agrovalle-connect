      <path d="M1 1L11 6L1 11Z" fill="#287c6f"/>
    </marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#17323a}
      .title{font-size:32px;font-weight:700}
      .subtitle{font-size:17px;fill:#577078}
      .layer{font-size:18px;font-weight:700;fill:#287c6f}
      .head{font-size:18px;font-weight:700}
      .body{font-size:15px;fill:#577078}
