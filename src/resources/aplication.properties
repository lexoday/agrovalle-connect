spring.application.name=agrovalle-connect

# Configuración de base de datos PostgreSQL
# (ajustar credenciales reales en application-local.properties, ignorado por git)
spring.datasource.url=jdbc:postgresql://localhost:5432/agrovalle_connect
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true