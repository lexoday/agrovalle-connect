spring.application.name=agrovalle-connect

# Configuración de base de datos PostgreSQL
# (ajustar credenciales reales en application-local.properties, ignorado por git)
spring.datasource.url=jdbc:postgresql://localhost:5432/agrovalle
spring.datasource.username=agro_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true